[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "streets-langgraph-browser-agent"
version = "0.3.0"
description = "A traceable LangGraph browser agent using Browserbase with human-in-the-loop controls"
requires-python = ">=3.11"
dependencies = [
  "browserbase>=1.4,<2",
  "fastapi>=0.115,<1",
  "langchain-openai>=1.0,<2",
  "langgraph>=1.0,<2",
  "langsmith>=0.4,<1",
  "playwright>=1.50,<2",
  "pydantic>=2.10,<3",
  "python-dotenv>=1.0,<2",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "langgraph-cli[inmem]>=0.4,<1",
  "pytest>=8.3,<10",
  "pytest-asyncio>=0.25,<2",
  "ruff>=0.11,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["streets_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

